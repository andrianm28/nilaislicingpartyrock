name: Deploy Business Name Generator Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build --template infra/template.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name business-name-generator-pro \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-5 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Get Stack Outputs and Deploy Frontend
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name business-name-generator-pro \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          # Get URLs
          BUSINESS_NAME_IDEAS_URL=$(get_output BusinessNameIdeasUrl)
          BUCKET_NAME=$(get_output BucketName)

          echo "Business Name Ideas URL: $BUSINESS_NAME_IDEAS_URL"
          echo "Bucket: $BUCKET_NAME"

          # Inject URLs into frontend
          sed -i "s|_URL_BUSINESS_NAME_IDEAS_|$BUSINESS_NAME_IDEAS_URL|g" frontend/index.html

          # Sync to S3
          aws s3 sync frontend/ s3://$BUCKET_NAME/ --cache-control no-cache

          # Print website URL
          WEBSITE_URL=$(get_output WebsiteUrl)
          echo "==========================================="
          echo "Website deployed at: $WEBSITE_URL"
          echo "==========================================="
